-weight="700" fill="#1C2430">Pas de base MySQL</text><text x="1555" y="786" text-anchor="middle" font-size="15" fill="#4A5361">stockage à définir</text><line x1="1555" y1="670" x2="1555" y2="716" stroke="#7C8594" stroke-width="2.5" stroke-dasharray="8 6"/><line x1="860" y1="340" x2="860" y2="400" stroke="#0B5F58" stroke-width="2.5"/><line x1="139" y1="400" x2="1555" y2="400" stroke="#0B5F58" stroke-width="2.5"/><polyline points="139,400 139,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="335,400 335,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="531,400 531,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="727,400 727,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="923,400 923,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="1119,400 1119,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><polyline points="1555,400 1555,496" fill="none" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><rect x="874" y="358" width="190" height="26" fill="#FFFFFF"/><text x="880" y="377" text-anchor="start" font-size="15" fill="#4A5361" font-style="italic">Routage /api/msX/**</text><polyline points="1240,600 1416,600" fill="none" stroke="#0B5F58" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#ahTeal)"/><text x="1328" y="572" text-anchor="middle" font-size="15" font-weight="700" fill="#0B5F58">GET /export/ai</text><text x="1328" y="630" text-anchor="middle" font-size="14" fill="#4A5361">format commun</text><line x1="40" y1="950" x2="90" y2="950" stroke="#0B5F58" stroke-width="2.5" marker-end="url(#ahTeal)"/><text x="100" y="955" font-size="15" fill="#4A5361">Appel REST routé par la Gateway</text><line x1="380" y1="950" x2="430" y2="950" stroke="#0B5F58" stroke-width="2.5" stroke-dasharray="