00" fill="#7A4100">MySQL</text><text x="531" y="820" text-anchor="middle" font-size="15" fill="#4A5361">ms3_db</text><rect x="638" y="500" width="178" height="140" rx="14" fill="#FFFFFF" stroke="#0B5F58" stroke-width="2.5"/><text x="727" y="537" text-anchor="middle" font-size="19" font-weight="700" fill="#0B5F58">MS4</text><text x="727" y="563" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2430">Sleep &amp;</text><text x="727" y="589" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2430">Mental Wellness</text><text x="727" y="615" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">:8084</text><line x1="727" y1="640" x2="727" y2="736" stroke="#C26A1A" stroke-width="2.5"/><path d="M667,754 v68 a60,14 0 0 0 120,0 v-68" fill="#FFFFFF" stroke="#C26A1A" stroke-width="2"/><ellipse cx="727" cy="754" rx="60" ry="14" fill="#FDF0D5" stroke="#C26A1A" stroke-width="2"/><text x="727" y="798" text-anchor="middle" font-size="17" font-weight="700" fill="#7A4100">MySQL</text><text x="727" y="820" text-anchor="middle" font-size="15" fill="#4A5361">ms4_db</text><rect x="834" y="500" width="178" height="140" rx="14" fill="#FFFFFF" stroke="#0B5F58" stroke-width="2.5"/><text x="923" y="537" text-anchor="middle" font-size="19" font-weight="700" fill="#0B5F58">MS5</text><text x="923" y="563" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2430">Caregiver &amp;</text><text x="923" y="589" text-anchor="middle" font-size="16" font-weight="700" fill="#1C2430">Social Connection</text><text x="923" y="615" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">:8085</text><line x1="923" y1="640" x2="923" y2="736" stroke="#C26A1A" stroke-width="2.5"/><path d="M863,754 v68 a60,14 0 0 0 120,0 v-68" fill="#FFFFFF" stroke="#C26A1A" stroke-width="2"/><ellipse cx="923" cy="754" rx="60" ry="14" fill="#FDF0D5" stroke="#C26A1A" stroke-width="2"/><text x="923" y="798" text-anchor="middle" font-size="17" font-weight="700" fill="#7