<text x="40" y="52" font-size="30" font-weight="700" fill="#1C2430">WellNest — Architecture microservices</text><text x="40" y="82" font-size="17" fill="#4A5361">6 microservices métier Spring Boot (une base MySQL chacun) + 1 moteur d’IA commun</text><rect x="710" y="110" width="300" height="74" rx="14" fill="#FFFFFF" stroke="#1C2430" stroke-width="2.5"/><text x="860" y="140" text-anchor="middle" font-size="20" font-weight="700" fill="#1C2430">Frontend Angular</text><text x="860" y="166" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">Interface adaptée aux seniors</text><rect x="120" y="250" width="320" height="90" rx="14" fill="#EEE8F7" stroke="#5B3F94" stroke-width="2.5"/><text x="280" y="275" text-anchor="middle" font-size="21" font-weight="700" fill="#3F2A6E">Keycloak</text><text x="280" y="301" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">Authentification · OAuth2 / JWT</text><text x="280" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">:8180</text><rect x="660" y="250" width="400" height="90" rx="14" fill="#0B5F58" stroke="#0B5F58" stroke-width="2.5"/><text x="860" y="275" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">API Gateway</text><text x="860" y="301" text-anchor="middle" font-size="15" font-weight="400" fill="#D7EEEA">Spring Cloud Gateway</text><text x="860" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#D7EEEA">:8080</text><rect x="1280" y="250" width="320" height="90" rx="14" fill="#E4ECFA" stroke="#1F4E9C" stroke-width="2.5"/><text x="1440" y="275" text-anchor="middle" font-size="21" font-weight="700" fill="#163A75">Eureka Server</text><text x="1440" y="301" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">Découverte des services</text><text x="1440" y="327" text-anchor="middle" font-size="15" font-weight="400" fill="#4A5361">:8761</text><polyline points="860,184 860,246" fill="none" stroke="#1C2430" stroke-width="